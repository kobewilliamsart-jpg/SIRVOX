<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>SIRVOX V8.4 • Lecteur Pro</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#121214">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SIRVOX">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
<script>
  if (typeof pdfjsLib !== 'undefined') {
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
  } else {
    console.warn('pdf.js failed to load from CDN — PDF import will be unavailable until the network allows it.');
  }
</script>
<style>
:root {
  --bg: #f4f4f6;
  --card: #ffffff;
  --text: #222;
  --muted: #666;
  --border: #e0e0e0;
  --accent: #b8f574;          /* vert citron doux */
  --accent-strong: #39ff14;
  --accent-text: #1a1a1a;
  --soft: #f0f0f2;
  --danger: #d9534f;
  --progress-bg: #e0e0e0;
}
body.dark {
  --bg: #121214;
  --card: #1e1e22;
  --text: #e8e8ec;
  --muted: #999;
  --border: #333;
  --soft: #2a2a2e;
  --progress-bg: #333;
  --accent: #b8f574;
  --accent-strong: #39ff14;
  --accent-text: #121212;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
body{background:var(--bg);color:var(--text);transition:background .3s,color .3s}
.app{max-width:520px;margin:0 auto;padding:10px;padding-bottom:180px;transition:.3s}
.app.desktop{max-width:1100px;display:grid;grid-template-columns:1.6fr 1fr;gap:12px}
.app.desktop header{grid-column:1/3}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;padding:12px 0;border-bottom:1px solid var(--border)}
.logo h1{font-size:22px;letter-spacing:2px;font-weight:800;color:var(--text)}
.logo h1 span{color:var(--accent-strong)}
.card{background:var(--card);border-radius:16px;padding:14px;margin-top:12px;border:1px solid var(--border);box-shadow:0 4px 12px rgba(0,0,0,.06)}
label{font-size:10px;color:var(--muted);letter-spacing:.8px;display:block;margin-bottom:6px;font-weight:700;text-transform:uppercase}
.btn{padding:13px;border:none;border-radius:12px;font-weight:700;cursor:pointer;font-size:14px}
.btn:active{opacity:.85}
.btn-play{background:var(--accent-strong);color:var(--accent-text);flex:1}
.btn-stop{background:var(--soft);color:var(--text);flex:1}
.btn-sec{background:var(--soft);color:var(--text);border:1px solid var(--border);padding:9px 12px;border-radius:10px;font-size:12px;cursor:pointer;flex:1;text-align:center;font-weight:600}
.controls{display:flex;gap:8px;margin-top:10px}
.progress{height:7px;background:var(--progress-bg);border-radius:4px;margin-top:10px;overflow:hidden}
.progress div{height:100%;background:var(--accent-strong);width:0%;transition:width .25s linear}
.lang-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.lang-badge{font-size:12px;padding:7px 14px;border-radius:20px;background:var(--soft);border:1px solid var(--border);cursor:pointer;color:var(--muted);font-weight:600}
.lang-badge.active{background:var(--accent-strong);color:var(--accent-text);border-color:var(--accent-strong)}
.pdf-viewer{max-height:120px;overflow:auto;background:var(--soft);border-radius:12px;border:1px solid var(--border);margin-top:8px;padding:6px;display:none}
.pdf-viewer.show{display:block}
.pdf-page{padding:8px;border-bottom:1px solid var(--border);cursor:pointer;font-size:12px;color:var(--muted)}
.pdf-page.active{background:rgba(184,245,116,.25);border-left:3px solid var(--accent-strong);color:var(--text)}
.list-item{background:var(--soft);padding:10px 12px;border-radius:10px;margin-top:8px;display:flex;justify-content:space-between;align-items:center;border:1px solid var(--border);font-size:13px;gap:8px}
#historyList{max-height:160px;overflow-y:auto;-webkit-overflow-scrolling:touch}
#libList{max-height:200px;overflow-y:auto;-webkit-overflow-scrolling:touch}
#bookmarks{max-height:150px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sv-paragraph{margin:0 0 14px 0}
.sv-paragraph:last-child{margin-bottom:0}
.sv-heading{font-weight:800;font-size:1.08em;margin-top:6px;margin-bottom:10px}
.sentence{display:inline;transition:background .2s}
.sentence.active{background:var(--accent);color:var(--accent-text);border-radius:4px;padding:1px 4px;font-weight:600}
#textDisplay{width:100%;height:260px;background:var(--soft);border:1px solid var(--border);border-radius:14px;padding:14px;color:var(--text);font-size:15px;overflow-y:auto;line-height:1.7;margin-top:10px;outline:none;-webkit-overflow-scrolling:touch}
#textDisplay:focus{border-color:var(--accent-strong)}
input[type=range]{accent-color:var(--accent-strong);width:100%}
input[type=text],select{background:var(--soft);border:1px solid var(--border);border-radius:10px;padding:9px 12px;color:var(--text);font-size:13px;width:100%}
.drop-zone{border:2px dashed var(--border);border-radius:14px;padding:18px;text-align:center;color:var(--muted);font-size:13px;margin-top:8px;transition:.2s}
.drop-zone.dragover{border-color:var(--accent-strong);background:rgba(184,245,116,.12)}
.loading{display:none;text-align:center;padding:12px;color:var(--muted);font-size:13px}
.loading.show{display:block}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:12px 20px;border-radius:12px;font-size:13px;z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90%}
.toast.show{opacity:1}
.header-btns{display:flex;gap:4px;flex-wrap:nowrap;flex-shrink:0;justify-content:flex-end;min-width:248px}
.voice-row{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.voice-btn{font-size:12px;padding:8px 14px;border-radius:20px;background:var(--soft);border:1px solid var(--border);cursor:pointer;color:var(--muted);font-weight:600}
.voice-btn.active{background:var(--accent-strong);color:var(--accent-text);border-color:var(--accent-strong)}

/* Welcome overlay */
.welcome-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:10000;display:flex;align-items:center;justify-content:center;padding:20px}
.welcome-box{background:var(--card);border-radius:20px;padding:24px;max-width:420px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.welcome-box h2{font-size:20px;margin-bottom:12px;color:var(--text)}
.welcome-box p,.welcome-box li{font-size:13px;line-height:1.55;color:var(--muted);margin-bottom:8px}
.welcome-box ul{padding-left:18px;margin-bottom:12px}
.welcome-box strong{color:var(--text)}
.welcome-box .note{background:rgba(184,245,116,.15);border-left:3px solid var(--accent-strong);padding:10px 12px;border-radius:8px;margin:14px 0;font-size:12px}
.welcome-lang{display:flex;justify-content:flex-end;gap:6px;margin-bottom:12px}
.welcome-lang button{flex:0;padding:6px 12px;font-size:12px;font-weight:800}

/* Immersion mode – keep navigation & page list always visible */
body.immersion #dropZone,
body.immersion #openBtn,
body.immersion #searchBtn,
body.immersion #searchInput,
body.immersion #bookmarkBtn,
body.immersion #lChooseLang,
body.immersion #langList,
body.immersion #lVoice,
body.immersion #voiceSelect,
body.immersion #lTone,
body.immersion #presetNormal,
body.immersion #presetRapide,
body.immersion #presetCinema,
body.immersion #rate,
body.immersion #pitch,
body.immersion #vol,
body.immersion #lSpeed,
body.immersion #lTon,
body.immersion #lVolume,
body.immersion #rv,
body.immersion #pv,
body.immersion #vv,
body.immersion #toolsCard,
body.immersion #saveBtn,
body.immersion #fontPlus,
body.immersion #fontMinus,
body.immersion .header-btns button:not(#themeBtn):not(#immerseBtn):not(#layoutBtn) {
  display: none !important;
}
body.immersion #textDisplay{height:58vh;font-size:18px}
body.immersion .app{padding-top:8px}
/* Force page list + navigation to stay visible even in immersion */
body.immersion #pdfViewer,
body.immersion #pagesBtn,
body.immersion #prevBtn,
body.immersion #nextBtn,
body.immersion #pageInfo,
body.immersion #pctInfo,
body.immersion #wordCount,
body.immersion .progress,
body.immersion #pageDock {
  display: block !important;
}
body.playing #pageDock,
body.playing #pageDock.show {
  display: flex !important;
}
body.immersion .controls {
  display: flex !important;
}

.storage-bar{height:6px;background:var(--progress-bg);border-radius:3px;margin-top:6px;overflow:hidden}
.storage-bar div{height:100%;background:var(--accent-strong);width:0%;transition:width .3s}
.page-dock{
  position:fixed;
  left:50%;
  transform:translateX(-50%);
  bottom:12px;
  width:calc(100% - 16px);
  max-width:520px;
  z-index:500;
  display:none;
  align-items:center;
  gap:8px;
  padding:8px 10px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  box-shadow:0 10px 28px rgba(0,0,0,.18);
}
.page-dock.show{display:flex}
.app.desktop ~ .page-dock, .app.desktop + .page-dock{max-width:1100px}
.page-dock .btn-sec{flex:0 0 auto;min-width:42px}
.page-dock-label{flex:0 0 auto;font-size:12px;font-weight:800;color:var(--text);white-space:nowrap}
.page-nums{flex:1;display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:2px 0}
.page-num{
  flex:0 0 auto;
  min-width:36px;
  height:34px;
  border-radius:10px;
  border:1px solid var(--border);
  background:var(--soft);
  color:var(--text);
  font-weight:800;
  font-size:12px;
  cursor:pointer;
}
.page-num.active{
  background:var(--accent-strong);
  color:var(--accent-text);
  border-color:var(--accent-strong);
}

@media(max-width:600px){.app.desktop{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app" id="app">
  <header>
    <div class="logo"><h1>SIR<span>VOX</span> <small style="font-size:11px;font-weight:500;opacity:.7">V8.4</small></h1></div>
    <div class="header-btns">
      <button class="btn-sec" id="infoBtn" style="flex:0;padding:5px 7px;font-size:13px" title="Infos">ℹ️</button>
      <button class="btn-sec" id="immerseBtn" style="flex:0;padding:5px 7px;font-size:13px" title="Mode immersion">⛶</button>
      <button class="btn-sec" id="themeBtn" style="flex:0;padding:5px 7px;font-size:13px">🌙</button>
      <button class="btn-sec" id="layoutBtn" style="flex:0;padding:5px 6px;font-size:10px">BUREAU</button>
      <button class="btn-sec" id="frBtn" style="background:var(--accent-strong);color:var(--accent-text);font-weight:700;flex:0;padding:5px 8px;font-size:11px">FR</button>
      <button class="btn-sec" id="enBtn" style="flex:0;padding:5px 8px;font-size:11px">EN</button>
    </div>
  </header>

  <div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <label id="lDoc">DOCUMENT — LECTEUR HORS LIGNE</label>
        <span id="storageInfo" style="font-size:10px;color:#27ae60">0 Docs</span>
      </div>

      <div style="margin-top:4px">
        <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--muted)">
          <span id="storageLabel">Stockage</span>
          <span id="storagePct">0%</span>
        </div>
        <div class="storage-bar"><div id="storageBar"></div></div>
      </div>

      <input type="file" id="fileInput" accept=".txt,.docx,.doc,.pdf,text/plain,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/octet-stream" hidden>
      
      <div class="drop-zone" id="dropZone">
        <div id="dropText">📄 Glissez un fichier ici (TXT, DOCX, PDF)<br><small>ou cliquez sur OUVRIR • Max 10 Mo</small></div>
      </div>

      <div style="display:flex;gap:6px;margin-top:10px">
        <button class="btn-sec" id="openBtn">OUVRIR</button>
        <button class="btn-sec" id="pagesBtn">PAGES X-Y</button>
        <button class="btn-sec" id="searchBtn">RECHERCHER</button>
      </div>

      <div class="loading" id="loading">Chargement du document…</div>

      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px">
        <label id="lChooseLang" style="margin:0">LANGUE DE LECTURE</label>
        <div style="display:flex;gap:4px">
          <button class="btn-sec" id="fontPlus" style="padding:3px 9px;font-size:11px">A+</button>
          <button class="btn-sec" id="fontMinus" style="padding:3px 9px;font-size:11px">A−</button>
        </div>
      </div>
      <div class="lang-list" id="langList"></div>

      <div style="margin-top:10px">
        <label id="lVoice">VOIX SYSTÈME DISPONIBLES</label>
        <select id="voiceSelect"></select>
      </div>

      <div id="textDisplay" contenteditable="true" spellcheck="false"></div>
      <div id="pdfViewer" class="pdf-viewer"></div>

      <div style="display:flex;gap:6px;margin-top:8px;align-items:center">
        <input type="text" id="searchInput" placeholder="Rechercher…" style="display:none;flex:1">
        <button class="btn-sec" id="bookmarkBtn" style="flex:0 0 auto">＋ MARQUE-PAGE</button>
      </div>

      <div class="progress"><div id="prog"></div></div>
      <div style="display:flex;justify-content:space-between;margin-top:5px;font-size:11px;color:var(--muted)">
        <span id="pageInfo">Page 1/1</span>
        <span id="pctInfo" style="color:#27ae60;font-weight:700">0%</span>
        <span id="wordCount">0 mots</span>
      </div>
    </div>

    <div class="card">
      <label id="lTone">RÉGLAGES AUDIO & PRÉRÉGLAGES</label>
      <div style="display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap">
        <button class="btn-sec" id="presetNormal">NORMAL</button>
        <button class="btn-sec" id="presetRapide">RAPIDE</button>
        <button class="btn-sec" id="presetCinema">CINÉMA</button>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">
        <div>
          <label><span id="lSpeed">Vitesse</span> <span id="rv">1.0</span></label>
          <input type="range" id="rate" min="0.5" max="2" step="0.1" value="1">
        </div>
        <div>
          <label><span id="lTon">Ton</span> <span id="pv">1.0</span></label>
          <input type="range" id="pitch" min="0.5" max="1.5" step="0.1" value="1">
        </div>
        <div>
          <label><span id="lVolume">Volume</span> <span id="vv">100%</span></label>
          <input type="range" id="vol" min="0" max="1" step="0.05" value="1">
        </div>
      </div>
    </div>
  </div>

  <div>
    <div class="card">
      <div class="controls">
        <button class="btn btn-play" id="playPauseBtn">LIRE / PAUSE</button>
        <button class="btn btn-stop" id="stopBtn">ARRÊTER</button>
      </div>
      <div class="controls">
        <button class="btn-sec" id="prevBtn">◀ PAGE</button>
        <button class="btn-sec" id="nextBtn">PAGE ▶</button>
        <button class="btn-sec" id="saveBtn">SAUVEGARDER</button>
      </div>
    </div>
    <div class="card" id="toolsCard">
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px">
        <button class="btn-sec" id="libBtn" style="flex:1"><span id="libBtnLabel"></span></button>
        <button class="btn-sec" id="bookBtn" style="flex:1"><span id="bookBtnLabel"></span></button>
        <button class="btn-sec" id="histBtn" style="flex:1"><span id="histBtnLabel"></span></button>
      </div>
      <button class="btn-sec" id="aiBtn" style="width:100%;background:rgba(122,92,255,.15);border-color:#7a5cff;color:#7a5cff;font-weight:700"><span id="aiBtnLabel"></span></button>
    </div>
  </div>
</div>

<!-- Library popup -->
<div class="welcome-overlay" id="libOverlay" style="display:none">
  <div class="welcome-box">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <h2 id="lLib" style="margin-bottom:0">BIBLIOTHÈQUE</h2>
      <button type="button" class="btn-sec" id="libCloseBtn" style="flex:0;padding:6px 10px">✕</button>
    </div>
    <div id="libList"></div>
  </div>
</div>

<!-- Bookmarks popup -->
<div class="welcome-overlay" id="bookOverlay" style="display:none">
  <div class="welcome-box">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <h2 id="lBook" style="margin-bottom:0">MARQUES-PAGES</h2>
      <button type="button" class="btn-sec" id="bookCloseBtn" style="flex:0;padding:6px 10px">✕</button>
    </div>
    <div id="bookmarks"></div>
  </div>
</div>

<!-- History popup -->
<div class="welcome-overlay" id="histOverlay" style="display:none">
  <div class="welcome-box">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px">
      <h2 id="lHist" style="margin-bottom:0">HISTORIQUE</h2>
      <div style="display:flex;gap:6px;flex:0 0 auto">
        <button type="button" class="btn-sec" id="clearHistBtn" style="flex:0;padding:6px 10px;background:rgba(217,83,79,.15);border-color:#d9534f;color:#d9534f"></button>
        <button type="button" class="btn-sec" id="histCloseBtn" style="flex:0;padding:6px 10px">✕</button>
      </div>
    </div>
    <div id="historyList"></div>
  </div>
</div>

<!-- AI popup -->
<div class="welcome-overlay" id="aiOverlay" style="display:none">
  <div class="welcome-box">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <h2 id="aiTitle" style="margin-bottom:0">OUTILS IA</h2>
      <button type="button" class="btn-sec" id="aiCloseBtn" style="flex:0;padding:6px 10px">✕</button>
    </div>
    <p id="aiInstructions" style="font-size:13px;color:var(--text);margin-bottom:14px;line-height:1.6"></p>
    <button class="btn btn-play" id="aiImageBtn" style="width:100%"></button>
    <p id="aiNote" style="font-size:12px;color:var(--muted);margin-top:12px;line-height:1.5"></p>
    <div id="aiStatus" style="font-size:13px;margin-top:8px;font-weight:700"></div>
  </div>
</div>

<input type="file" id="aiImageInput" accept="image/*" hidden>

<!-- Welcome Overlay -->
<div class="welcome-overlay" id="welcomeOverlay" style="display:none">
  <div class="welcome-box">
    <div class="welcome-lang">
      <button type="button" class="btn-sec" id="welcomeFrBtn">FR</button>
      <button type="button" class="btn-sec" id="welcomeEnBtn">EN</button>
    </div>
    <h2 id="wTitle"></h2>
    <p id="wSub"></p>
    <p><strong id="wHowTitle"></strong></p>
    <ol id="wHowList" style="padding-left:18px;margin-bottom:12px"></ol>
    <p><strong id="wFeatTitle"></strong></p>
    <ul id="wFeatList"></ul>
    <div class="note">
      <strong id="wNoteTitle"></strong><br>
      <span id="wNoteBody"></span>
    </div>
    <p id="wSize" style="font-size:12px;margin-top:8px"></p>
    <button class="btn btn-play" id="welcomeClose" style="width:100%;margin-top:16px"></button>
  </div>
</div>

<div class="toast" id="toast"></div>

<div id="pageDock" class="page-dock" aria-label="Pages">
  <button type="button" class="btn-sec" id="pageBarPrev">◀</button>
  <span id="pageBarLabel" class="page-dock-label">Page 1 / 1</span>
  <div id="pageNums" class="page-nums"></div>
  <button type="button" class="btn-sec" id="pageBarNext">▶</button>
</div>

<script>
(function(){
  'use strict';

  const MAX_FILE_SIZE = 10 * 1024 * 1024;      // 10 Mo
  const MAX_STORAGE   = 25 * 1024 * 1024;      // 25 Mo
  const CHUNK_SIZE    = 1800;
  const STORAGE_KEY   = 'sirvox_v82';

  let synth = window.speechSynthesis;
  let selectedLang = 'fr-FR';
  let selectedVoice = null;
  let allText = '';
  let pages = [''];
  let currentPage = 0;
  let uiLang = 'fr';
  let isPlaying = false;
  let isPaused = false;
  let currentUtterance = null;
  let currentFontSize = 15;
  let sentences = [];
  let sentenceIndex = 0;
  let currentDocId = null;          // for position memory

  let db = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{"docs":[],"bookmarks":[],"history":[],"positions":{},"welcomeSeen":false,"voicePrefs":{}}');
  if (!db.voicePrefs) db.voicePrefs = {}; // safety for users upgrading from an older saved db

  const langs = [
    {code:'fr-FR', name:'Français'},
    {code:'en-US', name:'English'}
  ];

  const i18n = {
    fr: {
      doc:"DOCUMENT — LECTEUR HORS LIGNE", open:"OUVRIR", pages:"PAGES X-Y", search:"RECHERCHER",
      chooseLang:"LANGUE DE LECTURE", voice:"VOIX SYSTÈME DISPONIBLES",

  let tesseractLoadPromise = null;
  function loadTesseract() {
    if (window.Tesseract) return Promise.resolve();
    if (tesseractLoadPromise) return tesseractLoadPromise;
    tesseractLoadPromise = new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@4.1.1/dist/tesseract.min.js';
      s.onload = resolve;
      s.onerror = () => { tesseractLoadPromise = null; reject(new Error('Tesseract load failed')); };
      document.head.appendChild(s);
    });
    return tesseractLoadPromise;
  }

  async function runOcrOnFile(file) {
    if (!file) return;
    const statusEl = document.getElementById('aiStatus');
    statusEl.style.color = 'var(--muted)';

    if (typeof navigator !== 'undefined' && navigator.onLine === false) {
      toast(t('aiNeedsInternet'));
      statusEl.textContent = t('aiNeedsInternet');
      statusEl.style.color = '#d9534f';
      return;
    }

    statusEl.textContent = t('aiAnalyzing') + ' 0%';
    try {
      await loadTesseract();
      const { data } = await Tesseract.recognize(file, 'fra+eng', {
        logger: m => {
          if (typeof m.progress === 'number') {
            statusEl.textContent = t('aiAnalyzing') + ' ' + Math.round(m.progress * 100) + '%';
          }
        }
      });
      const text = (data && data.text || '').trim();
      if (!text) { toast(t('aiError')); statusEl.textContent = ''; return; }
      allText = text;
      currentDocId = 'ocr_' + Date.now();
      splitPages(allText);
      document.getElementById('aiOverlay').style.display = 'none';
      statusEl.textContent = '';
      toast(t('aiDone'));
    } catch (err) {
      console.error('OCR error:', err);
      toast(t('aiError'));
      statusEl.textContent = t('aiError');
      statusEl.style.color = '#d9534f';
    }
  }

  function escapeHtml(str) {
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // Better sentence splitting – reduces long pauses on periods (especially English)
  // Operates on a single paragraph's text (newlines inside already normalized).
  function splitIntoSentences(text) {
    // Normalize multiple dots / ellipsis and keep reasonable pauses
    let cleaned = text
      .replace(/\.{3,}/g, '…')           // ellipsis
      .replace(/([.!?])\s+/g, '$1 ')     // single space after punctuation
      .replace(/[ \t]+/g, ' ')
      .trim();

    // Split on sentence endings but avoid splitting on common abbreviations.
    // IMPORTANT: any trailing text with no closing punctuation must still be
    // kept — a plain .match() would silently discard it, which was causing
    // whole words/phrases to disappear from imported documents.
    const re = /[^.!?…]+[.!?…]+\s*/g;
    const result = [];
    let m, lastIndex = 0;
    while ((m = re.exec(cleaned)) !== null) {
      result.push(m[0]);
      lastIndex = re.lastIndex;
    }
    const remainder = cleaned.slice(lastIndex).trim();
    if (remainder) result.push(remainder);

    return (result.length ? result : [cleaned]).map(s => s.replace(/\s+/g, ' ').trim()).filter(s => s.length > 0);
  }

  // Split page text into paragraphs, keeping chapters/headlines/paragraphs
  // visually separated instead of collapsing everything into one blob.
  function splitIntoParagraphs(text) {
    return text
      .split(/\n{2,}/)
      .map(p => p.trim())
      .filter(Boolean);
  }

  // A short line with no terminal punctuation is treated as a heading
  // (chapter title, section header, etc.) and styled accordingly.
  function isHeadingLike(paragraph) {
    if (paragraph.length > 80) return false;
    if (paragraph.includes('\n')) return false;
    if (/[.!?…]\s*$/.test(paragraph)) return false;
    return true;
  }

  function renderSentences(pageText) {
    const paragraphs = splitIntoParagraphs(pageText);
    sentences = [];
    let html = '';

    paragraphs.forEach(paragraph => {
      // Preserve single line breaks inside a paragraph (e.g. address blocks,
      // poem lines) while still allowing sentence splitting to work on it.
      const lines = paragraph.split(/\n+/).map(l => l.trim()).filter(Boolean);
      const heading = lines.length === 1 && isHeadingLike(lines[0]);
      const parText = lines.join(' ');
      const parSentences = splitIntoSentences(parText);
      if (!parSentences.length) return;

      const spans = parSentences.map(s => {
        const idx = sentences.length;
        sentences.push(s);
        return `<span class="sentence" data-i="${idx}">${escapeHtml(s)} </span>`;
      }).join('');

      html += heading
        ? `<p class="sv-paragraph sv-heading">${spans}</p>`
        : `<p class="sv-paragraph">${spans}</p>`;
    });

    if (!sentences.length) {
      sentences = [pageText || ''];
      html = `<p class="sv-paragraph"><span class="sentence" data-i="0">${escapeHtml(pageText || '')} </span></p>`;
    }

    textDisplay.innerHTML = html;
    textDisplay.style.fontSize = currentFontSize + 'px';
  }

  function highlightSentence(idx) {
    const all = textDisplay.querySelectorAll('.sentence');
    all.forEach(el => el.classList.remove('active'));
    if (idx >= 0 && idx < all.length) {
      all[idx].classList.add('active');
      const rect = all[idx].getBoundingClientRect();
      const box = textDisplay.getBoundingClientRect();
      if (rect.top < box.top + 30 || rect.bottom > box.bottom - 30) {
        all[idx].scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    }
  }

  function splitPages(txt) {
    const cleaned = txt.replace(/\r\n/g, '\n').replace(/\n{3,}/g, '\n\n');
    const paragraphs = cleaned.split(/\n\n+/);
    const chunks = [];
    let current = '';
    for (const p of paragraphs) {
      if ((current + '\n\n' + p).length > CHUNK_SIZE) {
        if (current) chunks.push(current.trim());
        current = p;
      } else {
        current += (current ? '\n\n' : '') + p;
      }
    }
    if (current) chunks.push(current.trim());
    pages = chunks.length ? chunks : [txt];
    currentPage = 0;
    showCurrentPage();
    renderPdfViewer();
    addHistory(txt.slice(0, 50));
  }

  function showCurrentPage() {
    const text = pages[currentPage] || '';
    renderSentences(text);
    document.getElementById('pageInfo').textContent = `${t('page')} ${currentPage+1}/${pages.length}`;
    const pct = Math.round(((currentPage+1)/Math.max(1, pages.length))*100);
    document.getElementById('pctInfo').textContent = pct + '%';
    upd();
    updatePageBar();
    savePosition();
  }

  function updatePageBar() {
    const dock = document.getElementById('pageDock');
    const label = document.getElementById('pageBarLabel');
    const nums = document.getElementById('pageNums');
    if (!dock || !label || !nums) return;

    const total = Math.max(1, pages.length);
    const hasContent = pages.some(p => (p || '').trim()) &&
      (pages[0] || '') !== i18n.fr.defaultText &&
      (pages[0] || '') !== i18n.en.defaultText;

    if (!hasContent && !isPlaying) {
      dock.classList.remove('show');
      dock.style.display = 'none';
      return;
    }

    dock.classList.add('show');
    dock.style.display = 'flex';
    label.textContent = `${t('page')} ${currentPage + 1} / ${total}`;
    nums.innerHTML = Array.from({ length: total }, (_, i) =>
      `<button type="button" class="page-num ${i === currentPage ? 'active' : ''}" data-i="${i}">${i + 1}</button>`
    ).join('');
    nums.querySelectorAll('.page-num').forEach(btn => {
      btn.onclick = () => {
        const idx = parseInt(btn.dataset.i, 10);
        if (!isNaN(idx)) goPage(idx);
      };
    });
    const active = nums.querySelector('.page-num.active');
    if (active) active.scrollIntoView({ inline: 'center', block: 'nearest' });
  }

  function renderPdfViewer() {
    const viewer = document.getElementById('pdfViewer');
    updatePageBar();
    if (pages.length <= 1) {
      viewer.classList.remove('show');
      viewer.style.display = 'none';
      viewer.innerHTML = '';
      return;
    }
    viewer.classList.add('show');
    viewer.style.display = 'block';
    viewer.innerHTML = pages.map((p, i) =>
      `<div class="pdf-page ${i===currentPage?'active':''}" data-i="${i}">
        <b>${t('page')} ${i+1}</b> — ${escapeHtml(p.slice(0,50))}…
      </div>`
    ).join('');
    viewer.querySelectorAll('.pdf-page').forEach(el => {
      el.onclick = () => {
        const idx = parseInt(el.dataset.i);
        if (!isNaN(idx)) goPage(idx);
      };
    });
  }

  function goPage(i) {
    if (i < 0 || i >= pages.length) return;
    // Always stop current speech cleanly when changing page
    try { synth.cancel(); } catch(_){}
    isPlaying = false;
    isPaused = false;
    document.body.classList.remove('playing');
    document.getElementById('playPauseBtn').textContent = t('play');
    prog.style.width = '0%';
    currentPage = i;
    sentenceIndex = 0;
    showCurrentPage();
    renderPdfViewer();
    savePosition();
  }

  // ——— Position memory ———
  function savePosition() {
    if (!currentDocId) return;
    db.positions[currentDocId] = { page: currentPage, sentence: sentenceIndex };
    saveDB();
  }
  function restorePosition(docId) {
    const pos = db.positions[docId];
    if (pos) {
      currentPage = Math.min(pos.page || 0, pages.length - 1);
      sentenceIndex = pos.sentence || 0;
    }
  }

  // ——— Speech (sentence based + exact resume) ———
  function startSentenceSpeech() {
    if (sentenceIndex >= sentences.length) {
      if (currentPage < pages.length - 1) {
        currentPage++;
        showCurrentPage();
        renderPdfViewer();
        sentenceIndex = 0;
        setTimeout(() => startSentenceSpeech(), 280);
      } else {
        isPlaying = false;
        isPaused = false;
        document.body.classList.remove('playing');
        document.getElementById('playPauseBtn').textContent = t('play');
        highlightSentence(-1);
        prog.style.width = '100%';
        savePosition();
      }
      return;
    }

    const sentence = sentences[sentenceIndex];
    highlightSentence(sentenceIndex);
    savePosition();

    currentUtterance = new SpeechSynthesisUtterance(sentence);
    currentUtterance.lang = selectedLang;
    if (selectedVoice) currentUtterance.voice = selectedVoice;
    currentUtterance.rate = parseFloat(document.getElementById('rate').value);
    currentUtterance.pitch = parseFloat(document.getElementById('pitch').value);
    currentUtterance.volume = parseFloat(document.getElementById('vol').value);

    // Slightly reduce pause feeling on English by a tiny rate boost on short sentences
    if (selectedLang.startsWith('en') && sentence.length < 40) {
      currentUtterance.rate = Math.min(2, currentUtterance.rate * 1.05);
    }

    const progress = (sentenceIndex + 1) / Math.max(1, sentences.length);
    prog.style.width = (progress * 100) + '%';
    document.getElementById('pctInfo').textContent = Math.round(progress * 100) + '%';

    currentUtterance.onend = () => {
      if (!isPlaying || isPaused) return;
      sentenceIndex++;
      startSentenceSpeech();
    };
    currentUtterance.onerror = () => {
      if (isPlaying && !isPaused) {
        sentenceIndex++;
        setTimeout(() => startSentenceSpeech(), 80);
      }
    };

    synth.speak(currentUtterance);
  }

  function stopSpeech(keepPage) {
    synth.cancel();
    isPlaying = false;
    isPaused = false;
    document.body.classList.remove('playing');
    document.getElementById('playPauseBtn').textContent = t('play');
    prog.style.width = '0%';
    document.getElementById('pctInfo').textContent = '0%';
    highlightSentence(-1);
    if (!keepPage) {
      sentenceIndex = 0;
      showCurrentPage();
    }
    updatePageBar();
    savePosition();
  }

  function playPause() {
    const btn = document.getElementById('playPauseBtn');

    if (isPlaying && !isPaused) {
      try { synth.pause(); } catch(_){}
      synth.cancel();
      isPaused = true;
      isPlaying = false;
      btn.textContent = t('resumeTxt');
      savePosition();
      return;
    }

    if (isPaused) {
      // Exact resume: continue from current sentenceIndex
      isPaused = false;
      isPlaying = true;
      document.body.classList.add('playing');
      btn.textContent = t('pauseTxt');
      startSentenceSpeech();
      return;
    }

    // Fresh start — never re-split the whole document from the visible page
    synth.cancel();
    applyCurrentPageEdit();
    let text = pages[currentPage] || textDisplay.innerText || '';
    if (!text.trim() || text === i18n.fr.defaultText || text === i18n.en.defaultText) {
      toast(t('noText'));
      return;
    }
    renderSentences(text);
    if (sentenceIndex >= sentences.length) sentenceIndex = 0;
    isPlaying = true;
    isPaused = false;
    document.body.classList.add('playing');
    btn.textContent = t('pauseTxt');
    renderPdfViewer();
    updatePageBar();
    startSentenceSpeech();
  }

  document.getElementById('playPauseBtn').onclick = playPause;
  document.getElementById('stopBtn').onclick = () => {
    sentenceIndex = 0;
    stopSpeech(false);
  };

  // ——— File import (text only, even if images present) ———
  const fileInput = document.getElementById('fileInput');
  const dropZone = document.getElementById('dropZone');
  const loadingEl = document.getElementById('loading');

  document.getElementById('openBtn').onclick = () => fileInput.click();
  dropZone.onclick = () => fileInput.click();

  ['dragenter','dragover'].forEach(ev => {
    dropZone.addEventListener(ev, e => { e.preventDefault(); dropZone.classList.add('dragover'); });
  });
  ['dragleave','drop'].forEach(ev => {
    dropZone.addEventListener(ev, e => { e.preventDefault(); dropZone.classList.remove('dragover'); });
  });
  dropZone.addEventListener('drop', e => {
    if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
  });
  fileInput.onchange = e => {
    if (e.target.files[0]) handleFile(e.target.files[0]);
    fileInput.value = '';
  };

  async function handleFile(file) {
    if (!file) return;
    if (file.size > MAX_FILE_SIZE) { toast(t('tooBig')); return; }
    loadingEl.classList.add('show');
    try {
      let full = '';
      const name = (file.name || '').toLowerCase();
      if (name.endsWith('.docx') || (file.type||'').includes('wordprocessingml')) {
        full = await extractDocx(file);
      } else if (name.endsWith('.pdf') || file.type === 'application/pdf') {
        full = await extractPdf(file);
      } else {
        full = await readAsText(file);
      }
      if (!full || !full.trim()) { toast(t('errorRead')); return; }
      allText = full;
      currentDocId = 'file_' + Date.now();
      splitPages(allText);
      toast('✓ ' + (file.name || 'Document'));
    } catch (err) {
      console.error(err);
      toast(t('errorRead'));
    } finally {
      loadingEl.classList.remove('show');
    }
  }

  function readAsText(file) {
    return new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = () => res(r.result || '');
      r.onerror = () => rej(r.error);
      r.readAsText(file, 'UTF-8');
    });
  }
  function readAsArrayBuffer(file) {
    return new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = () => res(r.result);
      r.onerror = () => rej(r.error);
      r.readAsArrayBuffer(file);
    });
  }
  function decodeXmlEntities(str) {
    return str
      .replace(/&lt;/g, '<')
      .replace(/&gt;/g, '>')
      .replace(/&quot;/g, '"')
      .replace(/&apos;/g, "'")
      .replace(/&amp;/g, '&');
  }

  // Regex-based DOCX extraction (instead of DOMParser XML mode).
  // DOMParser's handling of namespaced tags like <w:p> is inconsistent
  // across engines (notably WebKit/Safari on iPhone and some desktop
  // browsers) and can silently return zero paragraphs. Plain string/regex
  // parsing behaves identically on every platform.
  async function extractDocx(file) {
    const ab = await readAsArrayBuffer(file);
    const zip = await JSZip.loadAsync(ab);
    const xmlFile = zip.file('word/document.xml');
    if (!xmlFile) throw new Error('Invalid DOCX (missing word/document.xml)');
    const xml = await xmlFile.async('string');

    const paragraphMatches = xml.match(/<w:p[ >][\s\S]*?<\/w:p>/g) || [];
    let full = '';
    for (const p of paragraphMatches) {
      const withBreaks = p
        .replace(/<w:br[^/]*\/>/g, '\n')
        .replace(/<w:tab[^/]*\/>/g, '\t');
      const textMatches = withBreaks.match(/<w:t[^>]*>([\s\S]*?)<\/w:t>/g) || [];
      const paragraphText = textMatches
        .map(m => decodeXmlEntities(m.replace(/<w:t[^>]*>/, '').replace(/<\/w:t>/, '')))
        .join('');
      if (paragraphText.trim()) full += paragraphText + '\n\n';
    }
    if (!full.trim()) throw new Error('No readable text found in DOCX');
    return full;
  }

  async function extractPdf(file) {
    if (typeof pdfjsLib === 'undefined') {
      throw new Error('pdf.js not loaded (blocked network or offline)');
    }
    // Extract text only – images are ignored (good for heavy image PDFs).
    // Groups items into visual lines (by y-position) so we can both
    // reconstruct paragraph/line breaks AND detect + drop isolated
    // page-number lines (typical header/footer folios like "12" or "- 12 -")
    // that were otherwise getting read aloud in the middle of sentences.
    let pdf;
    try {
      const ab = await readAsArrayBuffer(file);
      pdf = await pdfjsLib.getDocument({ data: ab }).promise;
    } catch (workerErr) {
      // Some browsers (notably Safari/WebKit, and locked-down desktop
      // setups) can block the pdf.js background worker. Retry on the
      // main thread rather than failing the import entirely.
      console.warn('PDF worker failed, retrying without worker:', workerErr);
      const ab2 = await readAsArrayBuffer(file);
      pdf = await pdfjsLib.getDocument({ data: ab2, disableWorker: true }).promise;
    }

    const pageNumberLine = /^[\s\-–—_.]*\d{1,4}[\s\-–—_.]*$/;
    let full = '';

    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const content = await page.getTextContent();

      // Group text items into lines by vertical position
      const lines = [];
      for (const item of content.items) {
        const y = item.transform ? item.transform[5] : 0;
        let line = lines.find(l => Math.abs(l.y - y) < 2);
        if (!line) { line = { y, height: item.height || 10, parts: [] }; lines.push(line); }
        line.parts.push(item.str);
      }

      let pageText = '';
      let prevY = null;
      lines.forEach((line, idx) => {
        const text = line.parts.join(' ').replace(/\s+/g, ' ').trim();
        if (!text) return;
        // Skip a standalone numeric line sitting at the very top or bottom
        // of the page — almost always a running page number, not content.
        if (pageNumberLine.test(text) && (idx === 0 || idx === lines.length - 1)) return;
        if (prevY !== null) {
          const dy = Math.abs(prevY - line.y);
          pageText += dy > (line.height || 10) * 1.5 ? '\n\n' : '\n';
        }
        pageText += text;
        prevY = line.y;
      });

      if (pageText.trim()) full += pageText.trim() + '\n\n';
    }
    return full;
  }

  // ——— Navigation ———
  document.getElementById('pagesBtn').onclick = () => {
    const r = prompt(`${t('page')}s: 1-${pages.length}\nEx: 2-5`);
    if (r && r.includes('-')) {
      const s = parseInt(r.split('-')[0].trim());
      if (!isNaN(s) && s >= 1 && s <= pages.length) goPage(s - 1);
    }
  };
  document.getElementById('searchBtn').onclick = () => {
    const inp = document.getElementById('searchInput');
    inp.style.display = inp.style.display === 'none' ? 'block' : 'none';
    if (inp.style.display === 'block') inp.focus();
  };
  document.getElementById('searchInput').oninput = e => {
    const q = e.target.value.trim().toLowerCase();
    if (!q || !allText) return;
    const idx = allText.toLowerCase().indexOf(q);
    if (idx < 0) return;
    let pos = 0;
    for (let i = 0; i < pages.length; i++) {
      if (pos + pages[i].length >= idx) { goPage(i); break; }
      pos += pages[i].length + 2;
    }
  };

  document.getElementById('prevBtn').onclick = () => { if (currentPage > 0) goPage(currentPage - 1); };
  document.getElementById('nextBtn').onclick = () => { if (currentPage < pages.length - 1) goPage(currentPage + 1); };
  document.getElementById('pageBarPrev').onclick = () => { if (currentPage > 0) goPage(currentPage - 1); };
  document.getElementById('pageBarNext').onclick = () => { if (currentPage < pages.length - 1) goPage(currentPage + 1); };

  document.getElementById('bookmarkBtn').onclick = () => {
    db.bookmarks.unshift({ id: Date.now(), page: currentPage + 1, t: (pages[currentPage]||'').slice(0,50) });
    saveDB();
    renderBm();
    toast('✓');
  };

  // ——— Library with rename ———
  document.getElementById('saveBtn').onclick = () => {
    if (!allText || allText.length < 15) { toast(t('noText')); return; }
    if (getStorageSize() > MAX_STORAGE * 0.95) { toast(t('storageFull')); return; }

    const title = prompt(uiLang === 'fr' ? 'Nom du document :' : 'Document name:', 'Doc ' + (db.docs.length + 1));
    if (title === null) return;

    const id = Date.now();
    db.docs.unshift({
      id,
      title: title.trim() || ('Doc ' + (db.docs.length + 1)),
      text: allText.slice(0, 120000),
      date: new Date().toLocaleString()
    });
    currentDocId = id;
    if (db.docs.length > 20) db.docs = db.docs.slice(0, 20);
    saveDB();
    renderLib();
    toast(t('saved'));
  };

  function addHistory(snippet) {
    db.history.unshift({ id: Date.now(), t: snippet, date: new Date().toLocaleTimeString() });
    if (db.history.length > 12) db.history.pop();
    saveDB();
    renderHist();
  }

  function renderBm() {
    const el = document.getElementById('bookmarks');
    el.innerHTML = db.bookmarks.length ? db.bookmarks.map(b =>
      `<div class="list-item"><div><b>${t('page')} ${b.page}</b> — ${escapeHtml(b.t)}…</div>
       <button class="btn-sec" style="background:rgba(217,83,79,.15);color:var(--danger);border-color:var(--danger);flex:0" data-id="${b.id}">${t('delete')}</button></div>`
    ).join('') : `<p style="color:var(--muted);font-size:12px">${t('empty')}</p>`;
    el.querySelectorAll('[data-id]').forEach(btn => {
      btn.onclick = () => {
        db.bookmarks = db.bookmarks.filter(b => b.id != btn.dataset.id);
        saveDB(); renderBm();
      };
    });
  }

  function renderLib() {
    const el = document.getElementById('libList');
    el.innerHTML = db.docs.length ? db.docs.map(d =>
      `<div class="list-item">
        <div style="flex:1;min-width:0">
          <b class="doc-title" data-id="${d.id}">${escapeHtml(d.title)}</b><br>
          <small style="color:var(--muted)">${d.date}</small>
        </div>
        <div style="display:flex;gap:5px;flex-shrink:0">
          <button class="btn-sec" data-load="${d.id}">${t('open')}</button>
          <button class="btn-sec" data-rename="${d.id}" style="padding:6px 8px">✎</button>
          <button class="btn-sec" style="background:rgba(217,83,79,.15);color:var(--danger);border-color:var(--danger)" data-del="${d.id}">${t('delete')}</button>
        </div>
      </div>`
    ).join('') : `<p style="color:var(--muted);font-size:12px">${t('empty')}</p>`;

    el.querySelectorAll('[data-load]').forEach(btn => {
      btn.onclick = () => {
        const d = db.docs.find(x => x.id == btn.dataset.load);
        if (d) {
          allText = d.text;
          currentDocId = d.id;
          splitPages(allText);
          restorePosition(d.id);
          showCurrentPage();
          renderPdfViewer();
          upd();
        }
      };
    });
    el.querySelectorAll('[data-del]').forEach(btn => {
      btn.onclick = () => {
        db.docs = db.docs.filter(d => d.id != btn.dataset.del);
        delete db.positions[btn.dataset.del];
        saveDB(); renderLib();
      };
    });
    el.querySelectorAll('[data-rename]').forEach(btn => {
      btn.onclick = () => {
        const d = db.docs.find(x => x.id == btn.dataset.rename);
        if (!d) return;
        const newName = prompt(t('rename') + ' :', d.title);
        if (newName !== null && newName.trim()) {
          d.title = newName.trim();
          saveDB(); renderLib();
        }
      };
    });
  }

  function renderHist() {
    const el = document.getElementById('historyList');
    el.innerHTML = db.history.length ? db.history.map(h =>
      `<div class="list-item"><div><small style="color:#27ae60">${h.date}</small><br>${escapeHtml(h.t)}…</div></div>`
    ).join('') : `<p style="color:var(--muted);font-size:12px">${t('empty')}</p>`;
  }

  // Init
  setUILang('fr');
  renderLangList();
  renderBm(); renderLib(); renderHist();
  populateVoiceSelect();
  applyAudioSettings();
  updateStorageUI();
  showWelcomeIfNeeded();

  // Set default text
  if (!allText) textDisplay.innerText = i18n.fr.defaultText;
})();
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(err => console.warn('SW registration failed:', err));
    });
  }
</script>
</body>
</html>
